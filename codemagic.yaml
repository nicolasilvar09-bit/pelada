workflows:
  ios-fut-entre-amigos:
    name: Fut Entre Amigos iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      vars:
        BUNDLE_ID: "br.com.futentreamigos.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        APP_STORE_APPLE_ID: 6803957544
      node: 20.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Instalar dependencias
        script: npm install

      - name: Preparar a pasta web
        script: |
          mkdir -p www
          cp nuvem.html www/index.html
          cp nativo.js www/nativo.js
          cp privacidade.html www/privacidade.html

      - name: Gerar o projeto iOS
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios
          echo "--- conteudo de ios/App ---"
          ls -la ios/App

      - name: Buscar certificados e perfis
        script: |
          set -e
          keychain initialize
          echo "--- listando certificados existentes ---"
          app-store-connect certificates list --type IOS_DISTRIBUTION || true
          echo "--- buscando/criando arquivos de assinatura ---"
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --verbose
          echo "--- perfis baixados ---"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "pasta de perfis vazia"
          keychain add-certificates
          echo "--- certificados na keychain ---"
          security find-identity -v -p codesigning $(keychain get-default) || true

      - name: Aplicar perfis ao projeto
        script: |
          set -e
          xcode-project use-profiles --project "$XCODE_PROJECT" --verbose

      - name: Numero da build
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))

      - name: Compilar
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - misterwiz.angra@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
